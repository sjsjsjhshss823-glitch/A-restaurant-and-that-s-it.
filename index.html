<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>מלצר תלת־ממדי | משחק המסעדה</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#15253a;color:#172033}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#14243acc;z-index:4}.card{width:min(560px,100%);max-height:95dvh;overflow:auto;background:#fffaf0;border-radius:24px;padding:22px;box-shadow:0 18px 55px #0005}h1{font-size:clamp(26px,6vw,38px);margin:0 0 5px}.muted{color:#627083;margin-top:0}.group{margin-top:16px;font-weight:850}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.choice,.pill{border:2px solid #e0e5eb;background:white;border-radius:14px;padding:10px 6px;font-weight:800;color:#172033}.choice span{display:block;font-size:27px}.selected{border-color:#ff8b3d!important;background:#fff0e2!important}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pill{border-radius:99px;padding:9px 13px}.primary{margin-top:20px;width:100%;border:0;border-radius:15px;padding:15px;font-size:18px;font-weight:900;background:#ff923f;box-shadow:0 5px #c56726}.small{font-size:13px;color:#6b7584;line-height:1.5}#hud{display:none;position:fixed;z-index:2;top:10px;left:10px;right:10px;justify-content:space-between;gap:8px;pointer-events:none} .hudbox{background:#fffaf0ed;border-radius:14px;padding:10px 12px;font-weight:850;box-shadow:0 5px 16px #0002;font-size:14px}#mission{max-width:72%}#toast{display:none;position:fixed;z-index:3;top:74px;left:50%;transform:translateX(-50%);background:#172033ee;color:white;border-radius:99px;padding:10px 14px;font-weight:800;max-width:92%;text-align:center}#controls{display:none;position:fixed;z-index:3;bottom:14px;left:14px;right:14px;align-items:end;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:5px;direction:ltr;pointer-events:auto}.ctrl{border:0;border-radius:14px;background:#fffaf0e8;font-size:22px;font-weight:900;box-shadow:0 4px #bdb6a9;touch-action:none}.ctrl:active{transform:translateY(2px)}#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}#act{pointer-events:auto;width:84px;height:84px;border:0;border-radius:50%;background:#ff923f;font-weight:900;box-shadow:0 5px #c56726;touch-action:manipulation}#menu{display:none;position:fixed;z-index:3;right:10px;top:67px;border:0;border-radius:12px;padding:8px 12px;font-weight:800;background:#fffaf0}#finish{display:none}.finish{text-align:center}.finish .primary{margin-bottom:8px}
</style></head>
<body><div id="game"></div>
<div class="overlay" id="setup"><div class="card"><div style="font-size:42px">🍽️</div><h1>מלצר תלת־ממדי</h1><p class="muted">בחרו את המסעדה שלכם וצאו להגיש אוכל ללקוחות!</p>
<div class="group">1. סוג המסעדה</div><div class="choices" id="themes"><button class="choice selected" data-theme="burger"><span>🍔</span>המבורגרים</button><button class="choice" data-theme="pizza"><span>🍕</span>פיצרייה</button><button class="choice" data-theme="sushi"><span>🍣</span>סושי</button></div>
<div class="group">2. הדמות שלכם</div><div class="pills" id="avatars"><button class="pill selected" data-avatar="blue">🧑‍🍳 כחול</button><button class="pill" data-avatar="pink">👩‍🍳 ורוד</button><button class="pill" data-avatar="green">🧑‍🍳 ירוק</button></div>
<div class="group">3. רמת הקושי</div><div class="pills" id="diffs"><button class="pill selected" data-diff="easy">😊 קל</button><button class="pill" data-diff="normal">🙂 רגיל</button><button class="pill" data-diff="hard">🔥 מאתגר</button></div>
<button class="primary" id="start">מתחילים לשחק ▶</button><p class="small">בטלפון: החיצים וכפתור הפעולה. במחשב: WASD או חיצים, ו־E או רווח כדי לקחת ולהגיש. המשחק חינמי ופועל בדפדפן.</p></div></div>
<div id="hud"><div class="hudbox" id="mission">גש למטבח</div><div class="hudbox" id="score">⭐ 0</div></div><div id="toast"></div><button id="menu">↻ תפריט</button>
<div id="controls"><div class="pad"><button class="ctrl" id="up">▲</button><button class="ctrl" id="left">◀</button><button class="ctrl" id="down">▼</button><button class="ctrl" id="right">▶</button></div><button id="act">🍽️<br>לקחת / להגיש</button></div>
<div class="overlay" id="finish"><div class="card finish"><div style="font-size:54px">🏆</div><h1>כל הכבוד!</h1><p id="finishText">השלמת את המשמרת!</p><button class="primary" id="again">לשחק שוב</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);const root=$('game');
let theme='burger',avatar='blue',difficulty='easy',scene,camera,renderer,player,clock,active=false,holding=false,score=0,served=0,customers=[],blocked=[],keys={},pressed=new Set(),toastTimer;
const food={burger:'🍔 המבורגר',pizza:'🍕 פיצה',sushi:'🍣 סושי'},targets={easy:5,normal:8,hard:12},avatarColors={blue:0x3787e8,pink:0xef70a8,green:0x39a878};
function material(c){return new THREE.MeshStandardMaterial({color:c,roughness:.78})}
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function cyl(rt,rb,h,c,x,y,z,n=18){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),material(c));m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m}
function ball(r,c,x,y,z){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),material(c));m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m}
function tag(text,x,y,z,bg='#fff8ec',fg='#172033'){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const g=cv.getContext('2d');g.fillStyle=bg;g.beginPath();g.roundRect(4,4,504,120,24);g.fill();g.fillStyle=fg;g.font='bold 43px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,65,480);const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(2.65,.66),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));m.position.set(x,y,z);m.rotation.x=-.15;scene.add(m);return m}
function makeWorld(){if(renderer){renderer.dispose();root.innerHTML=''}customers=[];blocked=[];scene=new THREE.Scene();scene.background=new THREE.Color(0xb9dce7);scene.fog=new THREE.Fog(0xb9dce7,22,40);camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x7b887a,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-5,12,7);sun.castShadow=true;scene.add(sun);
box(22,.3,22,0xdac9a8,0,-.3,0);for(let i=-10;i<=10;i+=2){box(.025,.01,20,0xc9b58f,i,-.13,0);box(20,.01,.025,0xc9b58f,0,-.12,i)}box(22,3,.3,0xf0e4d1,0,1.3,-10.8);box(.3,3,22,0xe6d6bf,-10.8,1.3,0);box(.3,3,22,0xe6d6bf,10.8,1.3,0);box(22,3,.3,0xf0e4d1,0,1.3,10.8);box(21.5,.22,.35,0x98583b,0,2.65,-10.55);
tag(theme==='burger'?'מסעדת המבורגרים':theme==='pizza'?'פיצרייה':'מסעדת סושי',0,2.15,-10.45,'#8b4229','#ffffff');
for(const x of [-7,-3.5,3.5,7]){box(1.5,1.2,.1,0x82c8df,x,1.6,-10.55);box(1.6,.08,.15,0xffffff,x,1.6,-10.43);box(.08,1.3,.15,0xffffff,x,1.6,-10.43)}
box(5.8,1,1.6,0x86543a,-6.8,.5,-7.8);box(5.9,.15,1.7,0xf5efdf,-6.8,1.05,-7.8);tag('🍳 מטבח',-6.8,1.9,-7.6);for(const x of [-8.5,-6.8,-5.1]){cyl(.4,.4,.12,0x41474d,x,1.15,-7.8,22);cyl(.25,.25,.04,0xe8a54b,x,1.23,-7.8,22)}
const spots=[[-5,-2.7],[-1,-3.2],[3.2,-3],[6.2,-1],[-5.2,3.5],[-.7,3.6],[4,4.2]],shirts=[0x5577be,0xd45e4f,0x56a87d,0x9b68bd,0xd49a39,0x4f9eaf,0xc86d92];
spots.forEach(([x,z],i)=>{cyl(.15,.22,.9,0x75472e,x,.45,z);cyl(.9,.9,.16,0x9a603c,x,.98,z,28);cyl(.75,.75,.035,0xf7ecd9,x,1.08,z,28);cyl(.2,.2,.03,0xffffff,x-.22,1.12,z-.1);cyl(.07,.07,.2,0x8bc9df,x+.4,1.2,z+.1);box(.7,.15,.65,0x4c6877,x,.35,z+1.15);box(.7,.75,.14,0x4c6877,x,.72,z+1.48);cyl(.34,.4,.7,shirts[i],x,.8,z+.72);ball(.28,0xf0c6a2,x,1.39,z+.72);ball(.29,0x49362c,x,1.51,z+.72);ball(.045,0x242424,x-.1,1.4,z+.47);ball(.045,0x242424,x+.1,1.4,z+.47);const order=tag(food[theme],x,2.45,z+.5,'#fff5e5','#382b23');customers.push({x,z,order,waiting:true});blocked.push({x,z,r:1.05})});
for(const [x,z] of [[-9,-5],[9,-5],[-9,8],[9,8]]){cyl(.35,.4,.5,0xb65f43,x,.25,z);cyl(.05,.05,.75,0x478951,x,.8,z,10);for(let i=0;i<5;i++)ball(.16,0x4a9b60,x+Math.cos(i*1.25)*.22,1+Math.sin(i)*.1,z+Math.sin(i*1.25)*.22)}
player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CylinderGeometry(.31,.38,.86,18),material(avatarColors[avatar]));body.position.y=.78;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.26,16,12),material(0xf0c6a2));head.position.y=1.4;player.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12,0,Math.PI*2,0,Math.PI*.5),material(0x443229));hair.position.y=1.5;player.add(hair);const hat=new THREE.Mesh(new THREE.CylinderGeometry(.24,.27,.15,18),material(0xffffff));hat.position.y=1.7;player.add(hat);const tray=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.06,24),material(0xd8d6cf));tray.position.set(.45,1.12,0);tray.visible=false;player.add(tray);const meal=new THREE.Mesh(new THREE.SphereGeometry(.18,16,12),material(theme==='burger'?0xb87939:theme==='pizza'?0xe2a33a:0xf2f0e5));meal.position.set(.45,1.25,0);meal.visible=false;player.add(meal);player.userData.tray=tray;player.userData.meal=meal;player.position.set(-6.8,0,-4.7);cyl(.85,.85,.05,0x49a87a,-6.8,.02,-5.3,24);tag('קחו אוכל כאן',-6.8,1.9,-5.3,'#e4fff1','#15543c');blocked.push({x:-6.8,z:-7.8,r:2.05});for(let i=-10;i<=10;i+=2){blocked.push({x:i,z:-10.8,r:.5},{x:i,z:10.8,r:.5},{x:-10.8,z:i,r:.5},{x:10.8,z:i,r:.5})}camera.position.set(0,8,4);clock=new THREE.Clock()}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}
function hud(){ $('mission').textContent=holding?'🥡 יש אוכל! גש לשולחן של לקוח והגש':'🍳 גש לדלפק המטבח וקח '+food[theme];$('score').textContent='⭐ '+score+' נקודות · '+served+'/'+targets[difficulty]}
function interact(){if(!active)return;const x=player.position.x,z=player.position.z;if(!holding&&Math.hypot(x+6.8,z+7.8)<3){holding=true;player.userData.tray.visible=player.userData.meal.visible=true;toast('לקחת '+food[theme]+'! עכשיו גש ללקוח.');hud();return}if(holding){let c=null,d0=999;for(const v of customers){const d=Math.hypot(x-v.x,z-v.z);if(v.waiting&&d<2.15&&d<d0){c=v;d0=d}}if(c){holding=false;player.userData.tray.visible=player.userData.meal.visible=false;c.waiting=false;c.order.visible=false;score+=difficulty==='hard'?20:difficulty==='normal'?15:10;served++;hud();toast('הגשה מוצלחת! קיבלת נקודות ⭐');if(served>=targets[difficulty]){active=false;$('finishText').textContent='הגשת '+served+' מנות וצברת '+score+' נקודות!';$('finish').style.display='flex'}else setTimeout(()=>{if(scene&&active){c.waiting=true;c.order.visible=true}},1800);return}toast('התקרב לשולחן של לקוח ולחץ שוב.');return}toast('התקרב לדלפק המטבח כדי לקחת אוכל.')}
function bind(id,k){const el=$(id);const down=e=>{e.preventDefault();pressed.add(k);try{el.setPointerCapture(e.pointerId)}catch{}};const up=e=>{e.preventDefault();pressed.delete(k)};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}
bind('up','ArrowUp');bind('down','ArrowDown');bind('left','ArrowLeft');bind('right','ArrowRight');$('act').addEventListener('pointerdown',e=>{e.preventDefault();interact()});addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k))e.preventDefault();keys[k]=true;if(['e',' ','enter'].includes(k)&&!e.repeat)interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function frame(){requestAnimationFrame(frame);if(!renderer||!scene)return;const dt=Math.min(clock.getDelta(),.05);if(active){let dx=0,dz=0;if(keys.arrowup||keys.w||pressed.has('ArrowUp'))dz--;if(keys.arrowdown||keys.s||pressed.has('ArrowDown'))dz++;if(keys.arrowleft||keys.a||pressed.has('ArrowLeft'))dx--;if(keys.arrowright||keys.d||pressed.has('ArrowRight'))dx++;if(dx||dz){const l=Math.hypot(dx,dz);dx/=l;dz/=l;const speed=difficulty==='hard'?3.5:difficulty==='normal'?4:4.6,nx=THREE.MathUtils.clamp(player.position.x+dx*speed*dt,-9.7,9.7),nz=THREE.MathUtils.clamp(player.position.z+dz*speed*dt,-9.7,9.7);const hit=blocked.some(o=>Math.hypot(nx-o.x,nz-o.z)<o.r);if(!hit){player.position.x=nx;player.position.z=nz;player.rotation.y=Math.atan2(dx,dz)}else{if(!blocked.some(o=>Math.hypot(nx-o.x,player.position.z-o.z)<o.r))player.position.x=nx;if(!blocked.some(o=>Math.hypot(player.position.x-o.x,nz-o.z)<o.r))player.position.z=nz}}const target=new THREE.Vector3(player.position.x+6,7.5,player.position.z+7);camera.position.lerp(target,1-Math.exp(-dt*2.6));camera.lookAt(player.position.x,.4,player.position.z)}renderer.render(scene,camera)}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{avatar=b.dataset.avatar;document.querySelectorAll('[data-avatar]').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.diff;document.querySelectorAll('[data-diff]').forEach(x=>x.classList.toggle('selected',x===b))});
function start(){ $('setup').style.display='none';$('finish').style.display='none';score=0;served=0;holding=false;keys={};pressed.clear();makeWorld();active=true;$('hud').style.display='flex';$('controls').style.display='flex';$('menu').style.display='block';hud();toast('התחל במטבח, קח אוכל והגש ללקוחות!')}
$('start').onclick=start;$('again').onclick=()=>{active=false;$('finish').style.display='none';$('setup').style.display='flex';$('hud').style.display='none';$('controls').style.display='none';$('menu').style.display='none'};$('menu').onclick=()=>{active=false;$('setup').style.display='flex';$('hud').style.display='none';$('controls').style.display='none';$('menu').style.display='none'};addEventListener('resize',()=>{if(renderer&&camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});frame();
</script></body></html>
